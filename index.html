<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خدماتي · موقع السكان · ديمو</title>
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
--bg:#F4F5F7;--card:#FFFFFF;--ink:#1C1D21;--mute:#8B9098;
--line:#ECEEF1;--soft:#F7F8FA;--btn:#FF5A1F;--btnInk:#FFFFFF;
--orange:#FF5A1F;--orange2:#FF7A45;--orangeSoft:#FFF1EA;
--red:#FF5A1F;--redSoft:#FFF1EA;--redInk:#C2410C;--yel:#FFE8A3;--yelInk:#8A5A00;
--green:#16A34A;--greenSoft:#EAF8EF;--blue:#3B82F6;--blueSoft:#EAF2FF;
--brand:#FF5A1F;--brand2:#FF5A1F;--sh:0 8px 24px rgba(28,29,33,.04);
--gutter:24px}
*{box-sizing:border-box;min-width:0}
html,body{background:#F4F5F7;color-scheme:light}
body{margin:0;color:var(--ink);font:15px/1.55 'Cairo',system-ui,sans-serif;overflow-x:clip}
svg{width:20px;height:20px;flex:none;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
.h1{font-size:24px;font-weight:700}.h2{font-size:17px;font-weight:600}
.mut{color:var(--mute)}.sm{font-size:13px}.b{font-weight:600}.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:12px}.wrap{flex-wrap:wrap}
/* demo bar */
.bar{position:sticky;top:0;z-index:60;height:52px;background:#fff;color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 var(--gutter);border-bottom:1px solid var(--line)}
.bar .brand{font-weight:700;font-size:15px;margin-inline-end:auto;display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--ink);padding:0}
.bar .brand small{font-weight:400;color:var(--mute);font-size:12px}
.rb{height:34px;border-radius:999px;border:0;background:var(--soft);color:var(--mute);padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.rb.on{background:var(--orange);color:#fff;font-weight:600}
.rb svg{width:15px;height:15px}
@media(max-width:640px){.rb .t{display:none}.bar .brand small{display:none}}
/* generic */
.btn{height:44px;border-radius:12px;background:var(--orange);color:#fff;border:0;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.red{background:var(--orange);color:#fff}.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.w{width:100%}.btn.s{height:36px;border-radius:10px;font-size:13px;padding:0 12px}
.btn svg{width:16px;height:16px}.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--orangeSoft);color:var(--orange);display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:18px;height:18px}.ib .dot{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:#22C55E;border:2px solid #fff}
.card{background:var(--card);border-radius:12px;box-shadow:none;border:1px solid var(--line)}
.bdg{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.bdg svg{width:14px;height:14px}
.btn svg{width:16px;height:16px}
.b-red{background:var(--red);color:#fff}.b-yel{background:var(--yel);color:var(--yelInk)}.b-blue{background:var(--blueSoft);color:var(--blue)}
.b-green{background:var(--greenSoft);color:var(--green)}.b-gray{background:var(--soft);color:var(--mute)}.b-ink{background:var(--orangeSoft);color:var(--orange)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 10px;font-size:13px;color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:6px;padding:6px;background:var(--card);border-radius:14px;box-shadow:var(--sh);border:0}
.seg button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:500}
.seg button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex-wrap:wrap}
.chip{flex:none;min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}
.chip.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.chip b{font-size:15px}
.inp{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 14px;font-size:15px}
textarea.inp{height:auto;padding:12px 14px;resize:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:20px}
.step b{min-width:30px;text-align:center;font-size:17px}
.sum{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sum .ln{display:flex;justify-content:space-between;gap:12px}.sum hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.ok{padding:12px 14px;border-radius:12px;background:var(--greenSoft);color:var(--green);font-size:14px}
.warn{padding:12px 14px;border-radius:12px;background:#FFF6D6;color:var(--yelInk);font-size:14px}
/* website shells — desktop-first full-page portal */
.site{min-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:var(--bg)}
.site-head{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:40}
.site-head-in{max-width:1280px;margin:0 auto;padding:0 var(--gutter);height:56px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;font-weight:700;font-size:16px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center}
.logo i svg{width:18px;height:18px}
.logo span{display:flex;flex-direction:column;line-height:1.1;gap:0}.logo small{display:none}
.mn{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.mn > button{height:36px;padding:0 12px;border:0;background:none;border-radius:8px;color:var(--mute);font-weight:500;font-size:14px}
.mn > button.on{background:var(--orangeSoft);color:var(--orange);font-weight:600}
.mn .ib{width:36px;height:36px;background:var(--soft)}
.emer-btn{width:36px;height:36px;min-width:36px;padding:0;border:0;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.4px;line-height:1;flex:none}
.ham{display:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.ham svg{width:22px;height:22px}
@media(max-width:920px){.mn{display:none}.ham{display:grid;place-items:center}.emer-btn{margin-inline-start:auto}.site-head-in{height:56px}}
.site-body{flex:1;width:100%;display:flex;flex-direction:column;gap:0;padding:0;max-width:none}
.wrap-in{max-width:1280px;width:100%;margin:0 auto;padding:0 var(--gutter)}
.sec{padding:28px 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:18px;font-weight:700}
.sec-head p{margin:0;color:var(--mute);max-width:48ch}
.site-foot{border-top:1px solid var(--line);background:#fff;color:var(--mute);padding:16px var(--gutter);margin-top:auto}
.site-foot-in{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
.site-foot h3{color:var(--ink);font-size:15px;margin-bottom:8px}
.site-foot p,.site-foot li{margin:0;font-size:14px;line-height:1.7;color:var(--mute)}
.site-foot ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.site-foot .copy{grid-column:1/-1;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
@media(max-width:800px){.site-foot-in{grid-template-columns:1fr}}
.mnav{display:none;position:sticky;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px var(--gutter) calc(6px + env(safe-area-inset-bottom));grid-template-columns:repeat(4,1fr);align-items:center}
.mnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:8px 4px;border-radius:10px}
.mnav button svg{width:20px;height:20px}.mnav button.on{color:var(--ink);font-weight:600;background:var(--soft)}
.mnav .emer-btn{width:36px;height:36px;padding:0;margin:0 auto;border-radius:50%;background:var(--orange);color:#fff;font-size:9px;font-weight:800;letter-spacing:.3px;display:grid;place-items:center}
.mnav .emer-btn svg{display:none}
@media(max-width:920px){.mnav{display:grid}.site-body{padding-bottom:72px}}
/* full-bleed hero */
.hero-bleed{background:#fff;color:var(--ink);padding:clamp(36px,5vw,56px) 0 32px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:clamp(20px,4vw,40px);align-items:center}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr}}
.hero-copy{display:flex;flex-direction:column;gap:16px}
.hero-copy .kicker{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--mute);font-size:13px;font-weight:500}
.hero-copy h1{font-size:clamp(30px,4.4vw,44px);line-height:1.15;font-weight:700;max-width:18ch}
.hero-copy p{margin:0;font-size:16px;color:var(--mute);max-width:48ch;line-height:1.7}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero-actions .btn{min-width:148px}
.hero-actions .btn.light{background:var(--orange);color:#fff}
.hero-search{display:flex;align-items:center;gap:10px;height:52px;border-radius:14px;background:var(--soft);padding:0 6px 0 14px;max-width:520px;border:0}
.hero-search svg{width:18px;height:18px;color:var(--mute);flex:none}
.hero-search input{border:0;outline:0;flex:1;font-size:15px;height:100%;background:transparent;color:var(--ink)}
.hero-search .btn{height:40px;border-radius:10px;padding:0 16px}
.hero-panel{background:#fff;border:0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.hero-panel h3{font-size:16px}
.hero-panel .row button{flex:1;height:44px;border-radius:12px;border:0;background:var(--orangeSoft);color:var(--orange);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.hero-panel .row button svg{width:16px;height:16px}
.hero-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-meta div{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.hero-meta b{display:block;font-size:15px}.hero-meta span{font-size:12px;color:var(--mute)}
.trust{background:var(--card);border-bottom:1px solid var(--line);padding:18px 0}
.trust-in{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px}
.trust b{color:var(--ink)}
.svc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:1100px){.svc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.svc-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:row;align-items:center;text-align:start;gap:12px;min-height:64px}
.svc-tile:hover{border-color:#FFD0BC}
.svc-tile .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.svc-tile .ico svg{width:18px;height:18px}
.svc-tile .info{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:0}
.svc-tile b{font-size:14px;font-weight:600}.svc-tile small{font-size:13px;color:var(--mute)}.svc-tile .go{margin-top:auto;color:var(--orange);font-size:13px;font-weight:600}
.feat-band{display:grid;grid-template-columns:1.1fr .9fr;gap:0;min-height:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.feat-band img{width:100%;height:100%;min-height:320px;object-fit:cover;display:block}
.feat-band .txt{padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:14px;justify-content:center}
@media(max-width:900px){.feat-band{grid-template-columns:1fr}.feat-band img{min-height:220px;max-height:260px}}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:180px 180px;gap:12px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}
.gallery img:first-child{grid-row:1/3}
@media(max-width:800px){.gallery{grid-template-columns:1fr 1fr;grid-template-rows:160px 160px 160px}.gallery img:first-child{grid-row:auto;grid-column:1/-1;height:200px}}
.cat-banner{border-radius:12px;border:1px solid var(--line);background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:4px;box-shadow:none}
.cat-banner h1{font-size:20px;font-weight:700}
.cover{height:72px;border-radius:12px;background:var(--soft);display:flex;align-items:center;padding:0 16px;gap:12px;position:relative;overflow:hidden}
.cover svg{width:22px;height:22px;color:var(--orange)}
.cover.red{background:var(--redSoft)}.cover.red svg{color:var(--red)}
.cover.yel{background:#FFF6D6}.cover.yel svg{color:#7A5D00}
.job .thumb{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--soft)}
.job .thumb svg{width:20px;height:20px}
.act-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.act-strip{grid-template-columns:1fr}}
.act-card{padding:18px 18px;text-align:start;width:100%;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-height:120px}
.price-table{width:100%;border-collapse:collapse}
.price-table th{text-align:start;font-weight:500;color:var(--mute);font-size:13px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--soft)}
.price-table td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
.price-table tr:last-child td{border-bottom:0}
.price-table button.row-btn{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:start}
.price-table .p{font-weight:700;font-size:16px;white-space:nowrap}
.price-table .ask{height:36px;padding:0 14px;border-radius:10px;background:var(--orange);color:#fff;border:0;font-weight:600;font-size:13px;flex:none}
.cat-hero{padding:36px 0 8px;display:flex;flex-direction:column;gap:12px}
.cat-hero .crumb{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.cat-hero h1{font-size:22px}
.book-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start;padding-block:28px 48px}
@media(max-width:960px){.book-layout{grid-template-columns:1fr}}
.book-side{position:sticky;top:140px}
@media(max-width:960px){.book-side{position:static}}
.page{padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.page > .page-title{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page > .page-title h1{font-size:22px}
.top{display:flex;align-items:center;gap:8px}.top .ib{background:var(--card);border:1px solid var(--line)}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:900px){.how{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.how{grid-template-columns:1fr}}
.how .card{padding:20px;display:flex;flex-direction:column;gap:10px;min-height:140px}
.how .n{width:32px;height:32px;border-radius:10px;background:var(--orangeSoft);color:var(--orange);display:grid;place-items:center;font-weight:700}
/* tech dashboard */
.tech-shell .site-body{background:var(--bg)}
.tech-dash{padding-block:clamp(24px,3vw,40px) 48px}
.tech-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.tech-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
@media(max-width:900px){.tech-kpis{grid-template-columns:repeat(2,1fr)}}
.tech-kpi{padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.tech-kpi b{display:block;font-size:28px;margin-top:4px}
.job-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:860px){.job-board{grid-template-columns:1fr}}
.job{padding:18px;display:flex;gap:16px;text-align:start;width:100%;align-items:flex-start}
.job .t{flex:none;width:78px;display:flex;flex-direction:column;font-weight:700;font-size:18px;line-height:1.25;padding-top:2px}
.job-detail{display:grid;grid-template-columns:minmax(0,1.2fr) 340px;gap:22px;align-items:start}
@media(max-width:960px){.job-detail{grid-template-columns:1fr}}
/* resident / shared */
.home-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-top .search{width:min(100%,340px);flex:1 1 220px}
.li-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px}
.search svg{width:20px;height:20px;color:var(--mute)}.search input{border:0;background:none;outline:0;flex:1;font-size:16px;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:none;text-align:start;width:100%;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li svg.ch{width:18px;height:18px;color:var(--mute);flex:none}
.ocard{padding:16px;display:flex;flex-direction:column;gap:12px}
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
/* cover photo styles defined above */
.obtn{height:44px;border-radius:12px;background:var(--orange);color:#fff;border:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600}
.obtn svg{width:20px;height:20px}
.tl{list-style:none;margin:0;padding:16px;display:flex;flex-direction:column;gap:0}
.tl li{display:flex;gap:12px;position:relative;padding-bottom:16px}.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:0;width:2px;background:var(--line)}.tl li:last-child::before{display:none}
.tl .d{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin-top:3px;position:relative;z-index:1}
.tl .d.done{background:var(--orange);border-color:var(--orange)}.tl .d.cur{border:5px solid var(--orange)}
.av{width:40px;height:40px;border-radius:50%;background:var(--orangeSoft);color:var(--orange);display:grid;place-items:center;font-weight:600;flex:none}
.stars{display:flex;gap:6px}.stars button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.stars button svg{width:20px;height:20px}.stars button.on{background:var(--yel);border-color:var(--yel);color:var(--yelInk)}
.pulse{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--redSoft);color:var(--redInk);font-weight:500}
.pulse i{width:14px;height:14px;border-radius:50%;background:var(--red);flex:none;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(198,40,40,.55)}100%{box-shadow:0 0 0 14px rgba(198,40,40,0)}}
@media(prefers-reduced-motion:reduce){.pulse i{animation:none}}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);width:min(100%,460px);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:min(88dvh,720px);overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.grab{display:none}

  notify(o.resId,`${t.name} اتعيّن على طلب ${o.id}.`);notify(tid,`اتعيّنلك طلب ${o.id} في ${resOf(o.resId).unit} · ${dayLabel(o.date)} ${SLOTS[o.slot]||'فوراً'}.`);
  log('admin',`الإدارة عيّنت ${t.name} على ${o.id}`);save();render();toast(`اتعيّن ${t.name}`)},
 approve:(v)=>{const p=S.pending.splice(+v,1)[0];S.residents.push({id:'r'+(S.residents.length+1)+Date.now()%1000,name:p.name,unit:p.unit,phone:p.phone});log('admin',`الإدارة فعّلت حساب ${p.name} (${p.unit})`);save();render();toast('الحساب اتفعّل')},
 rejectR:(v)=>{const p=S.pending.splice(+v,1)[0];log('admin',`الإدارة رفضت تسجيل ${p.name}`);save();render()},
 addItem:()=>{const n=U.newItem.n.trim(),p=+U.newItem.p;if(!n||!p){toast('اكتب اسم الخدمة وسعرها');return}cat(U.aCat).items.splice(-0||cat(U.aCat).items.length,0,{n,p});log('admin',`خدمة جديدة في ${cat(U.aCat).name}: ${n} بـ ${money(p)}`);U.newItem={n:'',p:''};save();render();toast('الخدمة ظهرت للسكان')}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 if(el.classList.contains('sheetbg')&&e.target!==el)return;
 if(el.tagName==='A')return;
 e.preventDefault();const f=A[el.dataset.a];if(f)f(el.dataset.v,el.dataset);
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-m]');if(!el)return;const k=el.dataset.m.split('.');if(k.length===2)U[k[0]][k[1]]=el.value;else U[k[0]]=el.value;if(el.dataset.r)render()});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.price)return;const [c,i,f]=el.dataset.price.split('|'),v=Math.max(0,+el.value||0);const it=cat(c).items[+i];const old=it[f];it[f]=v;log('admin',`السعر اتعدّل: ${it.n} من ${old} لـ ${v} ج`);save();toast('السعر الجديد ظاهر للسكان دلوقتي')});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.f==='admin')go({screen:'app',role:'admin',aTab:'overview'})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sheet&&!U.paying){U.sheet=null;render()}});
window.addEventListener('storage',e=>{if(e.key!==SKEY)return;try{const n=JSON.parse(e.newValue);if(n&&n.orders){S=n;render()}}catch(x){}});
const fromHash=()=>{const h=location.hash.slice(1),r=Object.keys(HASH).find(k=>HASH[k]===h);if(r){U.screen='app';U.role=r;U.login=r}else if(!U.role){U.screen='app';U.role='res'}};
window.addEventListener('hashchange',()=>{fromHash();render()});
fromHash();
if(!U.role){U.screen='app';U.role='res'}
render();
}
</script>
